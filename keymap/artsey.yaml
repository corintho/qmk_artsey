layout:
  ortho_layout:
    rows: 2
    columns: 4
draw_config:
  combo_h: 22
  combo_w: 24
  arc_radius: 12
  n_columns: 2
  # try turning this on for separate combo diagrams!
  #separate_combo_diagrams: true
  combo_diagrams_scale: 2
layers:
  Base:
  - [{t: S, s: Number}, T, R, {t: A, s: Paren}]
  - [{t: O, h: Custom}, I, Y, {t: E, h: Symbol}]
  Number:
  - [{t: 'Number', type: held}, '3', '2', '1']
  - ['', '6', '5', '4']
  Symbol:
  - [\, ;, '`', '#']
  - ['=', '-', '@', {t: 'Symbol', type: held}]
  Paren:
  - ['{', '[', (, {t: 'Paren', type: held}]
  - ['}', ']', ), '']
  Nav:
  - [PG UP, HOME, UP, END]
  - [PG DN, LEFT, DOWN, RIGHT]
  Mouse:
  - [Scroll Up, BTN2, UP, BTN1]
  - [Scroll Down, LEFT, DOWN, RIGHT]
  Custom:
  - ['', VOL UP, MUTE, PLAY]
  - [{t: 'Custom', type: held}, VOL DN, PREV, NEXT]
combos:
  - {p: [3, 7],       k: ENT, a: mid, l: [Base, Nav], draw_separate: true}
  - {p: [2, 5],       k: DEL, a: mid, l: [Base, Nav], draw_separate: true}
  - {p: [2, 6],       k: "' (quote)", l: [Base], draw_separate: true}
  - {p: [6, 7],       k: C,    l: [Base], draw_separate: true}
  - {p: [4, 5],       k: N,    l: [Base], draw_separate: true}
  - {p: [2, 3],       k: F,    l: [Base], draw_separate: true}
  - {p: [1, 2],       k: G,    l: [Base], draw_separate: true}
  - {p: [5, 6],       k: U,    l: [Base], draw_separate: true}
  - {p: [0, 1],       k: J,    l: [Base], draw_separate: true}
  - {p: [3, 6],       k: ',',  l: [Base], draw_separate: true}
  - {p: [1, 5],       k: '!',  l: [Base], draw_separate: true}
  - {p: [0, 4],       k: '?',  l: [Base], draw_separate: true}
  - {p: [0, 2],       k: V,    l: [Base], draw_separate: true}
  - {p: [0, 1, 2, 3], k: Z,    l: [Base], draw_separate: true}
  - {p: [0, 1, 3],    k: Q,    l: [Base], draw_separate: true}
  - {p: [0, 3],       k: W,    l: [Base], draw_separate: true}
  - {p: [1, 2, 3],    k: D,    l: [Base], draw_separate: true}
  - {p: [0, 1, 2],    k: X,    l: [Base], draw_separate: true}
  - {p: [4, 6],       k: K,    l: [Base], draw_separate: true}
  - {p: [5, 7],       k: H,    l: [Base], draw_separate: true}
  - {p: [4, 5, 6, 7], k: SPC,  l: [Base, Nav], draw_separate: true}
  - {p: [4, 5, 7],    k: P,    l: [Base], draw_separate: true}
  - {p: [5, 6, 7],    k: L,    l: [Base], draw_separate: true}
  - {p: [4, 7],       k: B,    l: [Base], draw_separate: true}
  - {p: [4, 5, 6],    k: M,    l: [Base], draw_separate: true}
  - {p: [2, 3],       k: '7',  l: [Number]}
  - {p: [1, 2],       k: '8',  l: [Number]}
  - {p: [6, 7],       k: '9',  l: [Number]}
  - {p: [5, 6],       k: '0',  l: [Number]}
  - {p: [2, 7],       k: BSPC, l: [Base, Nav], draw_separate: true}
  - {p: [3, 5],       k: '.',  l: [Base], draw_separate: true}
  - {p: [3, 4],       k: /,    l: [Base], draw_separate: true}
  - {p: [2, 3, 4],    k: ESC, l: [Base, Nav], draw_separate: true}
  - {p: [2, 5, 7],    k: {t: Nav, h: lock}, draw_separate: true}
  - {p: [1, 3, 6],    k: {t: Mouse, h: lock}, draw_separate: true}
  - {p: [1, 2, 3, 4], k: TAB, l: [Base], draw_separate: true}
  - {p: [0, 1, 2, 7], k: {t: LSHFT, h: once}, l: [Base], draw_separate: true}
  - {p: [4, 5, 6, 3], k: {t: LSHIFT, h: lock}, l: [Base, Nav], draw_separate: true}
  - {p: [7, 0],       k: {t: LCTRL, h: lock}, l: [Base, Nav, Mouse], draw_separate: true}
  - {p: [6, 0],       k: {t: LGUI, h: lock}, l: [Base, Nav, Mouse], draw_separate: true}
  - {p: [5, 0],       k: {t: LALT, h: lock}, l: [Base, Nav, Mouse], draw_separate: true}
  - {p: [0, 1, 2, 3, 4, 5, 6, 7],       k: "CLEAR", l: [Base, Nav, Mouse], draw_separate: true}
  - {p: [3, 7, 0, 4], k: {t: Empty, type: ghost}, draw_separate: true}
  - {p: [0, 1, 4, 5], k: {t: Empty, type: ghost}, draw_separate: true}
  - {p: [2, 6, 1, 5], k: {t: Empty, type: ghost}, draw_separate: true}
  - {p: [2, 3, 6, 7], k: {t: Empty, type: ghost}, draw_separate: true}
